</style></head><body><header><h1>Fair O’Clock — пять вариантов логотипа</h1><p>Только надпись, без значков. Каждый вариант показан в рекламе, на бумаге и тиснением на коробке. Фото — Unsplash, только для примера.</p></header><main><figure><div class="h"><span>01</span><h2>Дом<small>Maison</small></h2></div><a href="01-maison.jpg"><img src="01-maison.jpg" alt="Maison" width="1600" height="1000"></a><p>Gloock — тяжёлая контрастная антиква с характером, без «волосяных» линий. Только надпись, как у старых часовых домов: никаких значков-кружков. Сокращённая подпись — сцепка FO.</p></figure><figure><div class="h"><span>02</span><h2>Ателье<small>Atelier</small></h2></div><a href="02-atelier.jpg"><img src="02-atelier.jpg" alt="Atelier" width="1600" height="1000"></a><p>Широкий гротеск в капсе с большим межбуквенным расстоянием — язык современных модных домов. Ничего лишнего, но буквы плотные и устойчивые. Выглядит дорого за счёт пустоты вокруг, а не декора.</p></figure><figure><div class="h"><span>03</span><h2>Журнал<small>Editorial</small></h2></div><a href="03-editorial.jpg"><img src="03-editorial.jpg" alt="Editorial" width="1600" height="1000"></a><p>Журнальная подача: прямое «Fair» и курсивное «O’Clock» в одну строку, как заголовок на обложке. Instrument Serif — узкая, плотная, без вычурности. Сразу ощущение глянца, а не шаблона.</p></figure><figure><div class="h"><span>04</span><h2>Женева<small>Genève</small></h2></div><a href="04-geneve.jpg"><img src="04-geneve.jpg" alt="Genève" width="1600" height="1000"></a><p>Классическая часовая школа: EB Garamond в капсе средней жирности, ровные пропорции, «Dubai» курсивом. Так подписаны циферблаты и сертификаты швейцарских мануфактур. Спокойная уверенность без попытки удивить.</p></figure><figure><div class="h"><span>05</span><h2>Перстень<small>Signet</small></h2></div><a href="05-signet.jpg"><img src="05-signet.jpg" alt="Signet" width="1600" height="1000"></a><p>Надпись с собственным знаком без кружков: буквы F и O сцеплены как гравировка на печатке. Шрифт Newsreader Display — плотная современная антиква. Сцепка работает и как аватар, и как тиснение на коробке.</p></figure></main></body></html>
