<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Fair O’Clock — варианты брендинга</title><style>

</style></head><body><header><small>Fair O’Clock · Private Watch House · Dubai</small><h1>Восемь вариантов фирменного стиля</h1><p>Знак, логотип, палитра, шрифты и примеры: пост, визитка, коробка, паспорт часов. Фото — бесплатные снимки Unsplash, только для примера. Нажмите на доску, чтобы открыть в полном размере.</p></header><main><figure><div class="h"><span>01</span><h2>Noir Atelier<small>Ночное ателье</small></h2></div><a href="01-noir.jpg"><img src="01-noir.jpg" alt="Noir Atelier" loading="lazy" width="1600" height="1000"></a><p>Классика ночного ювелирного бутика: чёрный бархат, шампанское золото, контрастная антиква. Знак — минутная шкала с выделенными «12 часами» и буквой F. Самый безопасный и «дорогой» вариант для Дубая.</p></figure><figure><div class="h"><span>02</span><h2>Ivory Salon<small>Светлый салон</small></h2></div><a href="02-ivory.jpg"><img src="02-ivory.jpg" alt="Ivory Salon" loading="lazy" width="1600" height="1000"></a><p>Светлая версия «тихой роскоши»: слоновая кость, чернила, бронза. Курсивная антиква как подпись мастера. Ощущение частного салона, а не магазина. Хорошо смотрится в ленте Instagram среди тёмных конкурентов.</p></figure><figure><div class="h"><span>03</span><h2>Desert Arch<small>Арка пустыни</small></h2></div><a href="03-desert.jpg"><img src="03-desert.jpg" alt="Desert Arch" loading="lazy" width="1600" height="1000"></a><p>Самый «дубайский» вариант: песок, терракота, глубокий малахит. Знак — арка восточного окна с отметкой «12» сверху. Двуязычный логотип с арабским написанием (перевод нужно проверить у носителя). Сразу читается как местный дом, а не очередной европейский клон.</p></figure><figure><div class="h"><span>04</span><h2>Green Vault<small>Зелёный сейф</small></h2></div><a href="04-vault.jpg"><img src="04-vault.jpg" alt="Green Vault" loading="lazy" width="1600" height="1000"></a><p>Эстетика частного банка и пробирной палаты: тёмно-зелёный, латунь, кремовая бумага. Знак — клеймо-хоруэмарк «F | O», как проба на золоте. Главный смысл бренда — «честно и проверено» — здесь виден без слов.</p></figure><figure><div class="h"><span>05</span><h2>Swiss Index<small>Швейцарский индекс</small></h2></div><a href="05-swiss.jpg"><img src="05-swiss.jpg" alt="Swiss Index" loading="lazy" width="1600" height="1000"></a><p>Современный швейцарский плакат: белый, чёрный и одна красная секундная стрелка. Строгий гротеск, много воздуха. Бренд выглядит как сервис, которому доверяют технически — точность, а не позолота.</p></figure><figure><div class="h"><span>06</span><h2>Ten Past Ten<small>Десять-десять</small></h2></div><a href="06-tuxedo.jpg"><img src="06-tuxedo.jpg" alt="Ten Past Ten" loading="lazy" width="1600" height="1000"></a><p>Полночный синий и платина. Знак — циферблат со стрелками на 10:10: так часы снимают во всех рекламных кампаниях, и коллекционер узнаёт это мгновенно. Апостроф в O’Clock — та же стрелка. Холодный, мужской, «смокинговый» премиум.</p></figure><figure><div class="h"><span>07</span><h2>Maison Bordeaux<small>Бордо и розовое золото</small></h2></div><a href="07-bordeaux.jpg"><img src="07-bordeaux.jpg" alt="Maison Bordeaux" loading="lazy" width="1600" height="1000"></a><p>Тёплая и чувственная роскошь: бордо, розовое золото, пудра. Монограмма — кольцо безеля «O», сквозь которое проходит курсивная «F». Подходит, если хотим притягивать не только коллекционеров, но и покупку часов в подарок.</p></figure><figure><div class="h"><span>08</span><h2>Collector’s Index<small>Каталог коллекционера</small></h2></div><a href="08-gallery.jpg"><img src="08-gallery.jpg" alt="Collector’s Index" loading="lazy" width="1600" height="1000"></a><p>Язык аукционного каталога и галереи: тёплый серый, чёрный моноширинный шрифт, координаты Дубая и отметка времени. Ни грамма позолоты — уверенность через точность. Для молодых коллекционеров, которые читают Hodinkee, а не глянец.</p></figure></main></body></html>
