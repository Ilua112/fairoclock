<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Fair O’Clock — светлый стиль</title><style>
:root{--bg:#F3EEE4;--ink:#1B1814;--dim:#6f6558;--acc:#8A6237}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font:400 16px/1.6 Georgia,serif;-webkit-font-smoothing:antialiased}

header h1{font-weight:700;font-size:clamp(34px,6vw,64px);line-height:1.05;margin:14px 0}header p{color:var(--dim);max-width:680px;font-family:Helvetica,Arial,sans-serif;font-size:15px}
main{max-width:1240px;margin:0 auto;padding:0 16px 80px}figure{margin:56px 0;border-top:1px solid rgba(138,98,55,.3);padding-top:28px}

</style></head><body><header><small>Fair O’Clock · Светлый салон</small><h1>Три плотных логотипа в светлом стиле</h1><p>Слоновая кость, чернила, бронза — как во втором варианте, но с весом: жирные шрифты и сплошные знаки, которые читаются и на аватаре, и на вывеске. Фото — Unsplash, только для примера.</p></header><main><figure><div class="h"><span>01</span><h2>Монолит<small>Monolith</small></h2></div><a href="01-monolith.jpg"><img src="01-monolith.jpg" alt="Monolith" width="1600" height="1000"></a><p>Та же светлая палитра, но буквы — с весом. Жирная контрастная антиква Bodoni в капсе, как на обложке Vogue или вывеске Dior. Знак — сплошная бронзовая монета с вырезанной F . Читается с другого конца зала и на маленьком аватаре.</p></figure><figure><div class="h"><span>02</span><h2>Печать<small>The Seal</small></h2></div><a href="02-seal.jpg"><img src="02-seal.jpg" alt="The Seal" width="1600" height="1000"></a><p>Логотип как сургучная печать на сертификате: плотная бронзовая медаль с минутной шкалой и вензелем FO. Рядом — полнокровная антиква Cormorant Bold с нормальным весом, без «волосяных» линий. Главный смысл — «проверено и заверено» — в самой форме знака.</p></figure><figure><div class="h"><span>03</span><h2>Циферблат вместо «O»<small>The Dial</small></h2></div><a href="03-dial.jpg"><img src="03-dial.jpg" alt="The Dial" width="1600" height="1000"></a><p>Самый графичный вариант: «O» в названии заменена бронзовым циферблатом со стрелками на 10:10, а сам этот циферблат и есть знак бренда. Жирная Playfair Display в две строки — плотный блок, который хорошо стоит на коробке, вывеске и в углу видео.</p></figure></main></body></html>
